<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi To-Do List Sederhana</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        #todo-form {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        #todo-input {
            padding: 10px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        #add-button {
            padding: 10px;
            margin-left: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        #add-button:hover {
            background-color: #218838;
        }

        #todo-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .todo-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: white;
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .todo-item.completed {
            text-decoration: line-through;
            color: #999;
        }

        .delete-button {
            background: red;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            padding: 5px 10px;
        }

        .delete-button:hover {
            background: darkred;
        }
    </style>
</head>
<body>

    <h1>To-Do List</h1>

    <div id="todo-form">
        <input type="text" id="todo-input" placeholder="Masukkan tugas baru..." />
        <button id="add-button">Tambah</button>
    </div>

    <ul id="todo-list"></ul>

    <script>
        const todoInput = document.getElementById('todo-input');
        const addButton = document.getElementById('add-button');
        const todoList = document.getElementById('todo-list');

        addButton.addEventListener('click', addTodo);
        todoList.addEventListener('click', handleListClick);

        function addTodo() {
            const todoText = todoInput.value.trim();
            if (todoText === '') return;

            const todoItem = document.createElement('li');
            todoItem.classList.add('todo-item');
            todoItem.innerHTML = `<span>${todoText}</span> <button class="delete-button">Hapus</button>`;
            todoList.appendChild(todoItem);
            todoInput.value = '';
        }

        function handleListClick(event) {
            if (event.target.tagName === 'SPAN') {
                event.target.parentElement.classList.toggle('completed');
            }

            if (event.target.classList.contains('delete-button')) {
                event.target.parentElement.remove();
            }
        }
    </script>

</body>
  </html>
